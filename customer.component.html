<div class="vw-content p-4 overflow-hidden">
  <div class="d-flex justify-content-between mb-3">
    <h1 class="my-auto fw-bold fs-2">Cadastro de Clientes</h1>
    <div class="d-flex flex-column flex-xxl-row align-items-end gap-3">
      <div class="d-flex gap-3">
        <div>
          <div class="d-flex h-100" role="search">
            <input class="form-control border-black w-272" type="search" placeholder="Pesquisar" aria-label="Pesquisar"
              [(ngModel)]="searchValue" />
          </div>
        </div>
        <div>
          <button class="btn btn-stonex btn-fill px-5 w-272" routerLink="detail">
            <i class="fa-solid fa-circle-plus fa-xl"></i>
            <span class="ms-2 fw-bold"> Incluir novo </span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <app-loading *ngIf="loading" [loading]="loading" color="text-stonex" [forContent]="true"></app-loading>
  <div class="table table-responsive small-table default-table" *ngIf="!loading">
    <div id="table-header-section">
      <p *ngFor="let name of tableHeader">{{ name }}</p>
    </div>
    <div id="table-row-section" *ngFor="
          let customer of customersResponse
            | filterCustomer : searchValue : filteredLength
            | slice
              : (currentPage - 1) * pageSize
              : (currentPage - 1) * pageSize + pageSize
        " style="cursor: pointer" [routerLink]="['detail', customer.ID.Numero]">
      <p [title]="customer.Nome"></p>
      <p [title]="customer.SINACORCodigo.valor"></p>
      <p [title]="customer.EUAGrupoContaCodigo.valor"></p>
      <p [title]="customer.EUAContaCodigo.valor"></p>
    </div>
  </div>
  <app-pagination *ngIf="this.customersResponse" [(inputPageSize)]="pageSize" [inputDataResponse]="this.customersResponse"
    [inputSearchValue]="searchValue" [inputFilteredLength]="filteredLength"
    [(currentPage)]="currentPage">
  </app-pagination>
</div>
